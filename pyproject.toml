[tool.poetry]
name = "content-virality-analyzer"
version = "0.1.0"
description = "AI-powered content virality analysis and prediction system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "virality_analyzer", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.9.7 || >3.9.7,<3.13"
pandas = "^2.1.0"
numpy = "^1.25.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
catboost = "^1.2.0"
transformers = "^4.35.0"
torch = "^2.1.0"
sentence-transformers = "^2.2.0"
shap = "^0.43.0"
lime = "^0.2.0"
causalml = "^0.15.0"
plotly = "^5.17.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
opencv-python = "^4.8.0"
pillow = "^10.1.0"
nltk = "^3.8.0"
textstat = "^0.7.0"
vaderSentiment = "^3.3.0"
faiss-cpu = "^1.7.0"
openai = "^1.0.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
streamlit = "^1.29.0"
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
loguru = "^0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.9.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.6.0"
jupyter = "^1.0.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
